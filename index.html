<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animus Genetic Archive | Assassin's Creed</title>
  <meta name="description" content="Cinematic scroll-driven timeline of Assassin's Creed memory sequences.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cinzel:wght@400;500;600;700&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            cinzelDec: ['Cinzel Decorative', 'serif'],
            cinzel: ['Cinzel', 'serif'],
            orbitron: ['Orbitron', 'sans-serif']
          }
        }
      }
    }
  </script>
  <style>
    /* Global scrollbars */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: #040507; }
    ::-webkit-scrollbar-thumb { background: #556070; border-radius: 2px; }

    /* Sticky Cinematic Viewport */
    .got-sticky {
      position: sticky;
      top: 0;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      background: #000;
    }

    /* Cinematic Vignette */
    .got-vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 35%, rgba(0, 0, 0, 0.9) 100%);
      pointer-events: none;
      z-index: 2;
    }



    /* Database grid cards */
    .archive-card {
      background: linear-gradient(135deg, #090b10 0%, #121722 60%, #090b10 100%);
      border: 1px solid rgba(255, 255, 255, 0.05);
      transition: border-color 0.4s ease, box-shadow 0.4s ease, transform 0.3s ease;
    }
    .archive-card:hover {
      border-color: rgba(255, 255, 255, 0.25);
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.08);
      transform: translateY(-4px);
    }
  </style>
</head>
<body class="bg-[#040507] text-[#e2e8f0] font-sans antialiased selection:bg-white selection:text-black">

  <!-- Main Scroll Container -->
  <div id="timeline-container" class="relative w-full h-[1200vh]">

    <!-- Sticky Viewport -->
    <div class="got-sticky flex flex-col md:flex-row items-center justify-between">
      
      <div class="got-vignette"></div>

      <!-- Top Nav Header -->
      <header class="absolute top-0 left-0 right-0 z-20 flex items-center justify-between px-6 py-4 md:px-12 md:py-6 pointer-events-auto">
        <div class="flex items-center gap-3">
          <span class="w-1.5 h-1.5 rounded-full bg-cyan-400 animate-pulse"></span>
          <span class="font-cinzelDec text-xs tracking-[0.25em] text-cyan-400">◈ ANIMUS CORE</span>
        </div>
        <div class="font-orbitron text-[9px] text-slate-500 tracking-widest uppercase">
          GENETIC TIMELINE RECORD
        </div>
      </header>

      <!-- Left Column: Typography -->
      <div class="relative w-full md:w-1/2 h-full z-10 flex flex-col justify-center px-8 md:px-24 text-center md:text-left">
        <div class="max-w-xl space-y-4 md:space-y-6">
          <div id="sigil-label" class="h-16 md:h-20 select-none opacity-0 flex justify-center md:justify-start">
            <img id="chapter-left-logo" class="h-full object-contain" src="" alt="Game Logo">
          </div>
          <div>
            <p id="chapter-subtitle" class="font-orbitron text-[9px] md:text-[10px] text-cyan-400 tracking-[0.4em] uppercase opacity-0"></p>
            <h2 id="chapter-title" class="font-cinzel text-3xl md:text-5xl lg:text-6xl font-black text-white tracking-[0.15em] mt-2 opacity-0"></h2>
            <h3 id="chapter-year" class="font-orbitron text-sm md:text-base text-slate-400 tracking-widest mt-2 opacity-0"></h3>
          </div>
          <div class="h-px bg-cyan-500/20 w-32 rounded mx-auto md:mx-0"></div>
          <p id="chapter-body" class="font-cinzel text-xs md:text-sm text-slate-300 leading-relaxed font-light max-w-xl opacity-0"></p>
        </div>
      </div>

      <!-- Right Column: Character Showcase -->
      <div class="absolute inset-0 md:relative md:w-1/2 h-full z-0 md:z-10 flex items-center justify-center p-6 md:p-12 pointer-events-none md:pointer-events-auto">
        <img id="chapter-char-image" class="h-[60vh] md:h-5/6 max-h-[80vh] object-contain opacity-0 select-none transition-opacity duration-300" src="" alt="Assassin">
      </div>

      <!-- Left Active indicator nodes -->
      <div class="absolute left-6 md:left-12 top-1/2 -translate-y-1/2 z-20 flex flex-col gap-2.5">
        <div id="hud-timeline-ticks" class="flex flex-col gap-1.5">
          <!-- Populated by app.js -->
        </div>
      </div>
      
      <!-- Bottom Scroll guide -->
      <div class="absolute bottom-6 left-1/2 -translate-x-1/2 z-20 text-center opacity-70 animate-bounce">
        <span class="font-orbitron text-[8px] text-slate-400 tracking-[0.3em] uppercase">SCROLL DOWN FOR DATABASE GRID</span>
      </div>

    </div>

  </div>

  <!-- ── SECONDARY VIEW: ARCHIVE DATABASE GRID ────────────────── -->
  <section class="relative z-10 bg-[#06070a] border-t border-white/5 py-24 px-6 md:px-12">
    <div class="max-w-6xl mx-auto space-y-12">
      
      <div class="text-center space-y-2">
        <span class="font-orbitron text-[9px] text-cyan-500 tracking-[0.4em] uppercase">ABSTERGO ARCHIVE INDEX</span>
        <h2 class="font-cinzel text-2xl md:text-4xl text-white tracking-widest">GENETIC DOSSIERS</h2>
        <div class="h-0.5 bg-cyan-400/20 w-24 mx-auto rounded mt-3"></div>
      </div>

      <!-- Grid list -->
      <div id="archive-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
        <!-- Generated dynamically via app.js -->
      </div>

    </div>
  </section>

  <!-- Dossier details modal -->
  <div id="details-modal" class="fixed inset-0 z-50 bg-black/95 backdrop-blur-md hidden flex items-center justify-center p-4">
    <div class="bg-[#0b0e14] border border-cyan-400/30 max-w-2xl w-full rounded-lg relative flex flex-col md:flex-row overflow-hidden shadow-[0_0_50px_rgba(0,240,255,0.15)]">
      
      <!-- Close trigger -->
      <button onclick="closeModal()" class="absolute top-4 right-4 text-xs font-orbitron text-slate-500 hover:text-white transition-colors z-20">✕ CLOSE</button>

      <!-- Left: character image frame -->
      <div class="w-full md:w-1/2 h-64 md:h-auto relative bg-black/40 flex items-center justify-center p-6 border-b md:border-b-0 md:border-r border-white/5 flex-shrink-0">
        <img id="modal-char-image" class="h-full max-h-80 object-contain drop-shadow-[0_0_20px_rgba(0,240,255,0.3)] select-none" src="" alt="Assassin">
      </div>

      <!-- Right: details panel -->
      <div class="flex-1 p-6 space-y-4">
        <div>
          <span id="modal-seq" class="font-orbitron text-[9px] text-cyan-400 tracking-wider"></span>
          <h2 id="modal-title" class="font-cinzel text-xl font-bold text-white tracking-wider mt-0.5"></h2>
          <p id="modal-subtitle" class="font-cinzel text-[10px] text-slate-400 tracking-wide uppercase mt-0.5"></p>
        </div>

        <div class="h-px bg-white/5 w-full"></div>

        <div class="space-y-2 text-xs font-mono">
          <div><span class="text-slate-500">YEAR:</span> <span id="modal-year" class="text-cyan-400 font-bold"></span></div>
          <div><span class="text-slate-500">ERA:</span> <span id="modal-era" class="text-white"></span></div>
          <div><span class="text-slate-500">ASSASSIN:</span> <span id="modal-assassin" class="text-white"></span></div>
          <div><span class="text-slate-500">LOCATION:</span> <span id="modal-location" class="text-white"></span></div>
        </div>

        <div class="space-y-1">
          <span class="text-[9px] text-slate-500 block tracking-wider font-mono">BRIEF DESCRIPTION</span>
          <p id="modal-desc" class="text-xs text-slate-300 leading-relaxed font-light font-sans"></p>
        </div>
      </div>
    </div>
  </div>

  <!-- GSAP Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
